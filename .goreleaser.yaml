version: 2

project_name: oni3

before:
  hooks:
    - go mod tidy

builds:
  # The only binary: oni3
  - id: oni3
    main: .
    binary: oni3
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/tk103331/oni3/version.Version={{ .Version }}

# Ship compressed archives: a stripped binary is ~50 MB, while gzip brings the
# download down to ~15 MB. The npm installer and the Homebrew formula unpack
# `oni3` from oni3_<version>_<os>_<arch>.tar.gz. Windows gets a zip, which is
# what its tooling expects.
archives:
  - id: oni3
    ids: [oni3]
    formats: [tar.gz]
    name_template: "{{ .Binary }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

release:
  github:
    owner: tk103331
    name: oni3
  draft: false
  prerelease: auto
