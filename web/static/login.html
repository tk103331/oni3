<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>ONI3 Web · 登录</title>
<script>
  (function () {
    try {
      var stored = localStorage.getItem("oni3" + "-theme");
      if (stored !== "light" && stored !== "dark") {
        stored = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
      }
      document.documentElement.dataset.theme = stored;
    } catch (_) {}
  })();
</script>
<style>
  :root {
    color-scheme: dark;
    --bg: #0e1015;
    --panel: #151823;
    --panel-2: #1b2030;
    --text: #e6e9f2;
    --muted: #8d95a8;
    --border: #262c3d;
    --accent: #7c9cff;
    --danger: #ff7b72;
    --glow: #182033;
    --accent-soft: rgba(124, 156, 255, .14);
    --accent-border: rgba(124, 156, 255, .35);
    --accent-focus: rgba(124, 156, 255, .6);
    --accent-contrast: #0b0e16;
    --code: #10131c;
    --shadow: 0 24px 70px rgba(0, 0, 0, .5);
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --bg: #f4f6fa;
    --panel: #ffffff;
    --panel-2: #edf0f6;
    --text: #1b2030;
    --muted: #687089;
    --border: #dce1ea;
    --accent: #3f63d8;
    --danger: #c43d34;
    --glow: #e3e9f8;
    --accent-soft: rgba(63, 99, 216, .1);
    --accent-border: rgba(63, 99, 216, .32);
    --accent-focus: rgba(63, 99, 216, .5);
    --accent-contrast: #ffffff;
    --code: #f0f2f7;
    --shadow: 0 24px 70px rgba(31, 42, 68, .16);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: radial-gradient(circle at 50% 20%, var(--glow) 0, var(--bg) 55%);
    color: var(--text);
    font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  }
  .card {
    width: min(400px, calc(100vw - 40px));
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 28px 28px 24px;
    box-shadow: var(--shadow);
  }
  .brand {
    display: flex;
    align-items: baseline;
    gap: 8px;
    font-weight: 700;
    font-size: 21px;
    letter-spacing: .5px;
    text-transform: uppercase;
  }
  .brand span {
    font-size: 11px;
    font-weight: 600;
    color: var(--accent);
    border: 1px solid var(--accent);
    border-radius: 999px;
    padding: 1px 7px;
    letter-spacing: 1px;
  }
  .lock {
    width: 40px;
    height: 40px;
    margin: 24px 0 12px;
    border-radius: 12px;
    display: grid;
    place-items: center;
    background: var(--accent-soft);
    border: 1px solid var(--accent-border);
    color: var(--accent);
    font-size: 19px;
  }
  h1 { font-size: 17px; margin: 0 0 6px; font-weight: 650; }
  p { margin: 0 0 18px; color: var(--muted); font-size: 13px; }
  label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  input {
    width: 100%;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
    color: var(--text);
    font: inherit;
    outline: 0;
  }
  input:focus { border-color: var(--accent-focus); }
  button {
    width: 100%;
    margin-top: 14px;
    background: var(--accent);
    border: 0;
    border-radius: 10px;
    padding: 10px 14px;
    color: var(--accent-contrast);
    font: inherit;
    font-weight: 650;
    cursor: pointer;
  }
  button:disabled { opacity: .55; cursor: default; }
  .error {
    margin-top: 12px;
    color: var(--danger);
    font-size: 12.5px;
    min-height: 18px;
  }
  .hint {
    margin-top: 16px;
    padding-top: 14px;
    border-top: 1px solid var(--border);
    color: var(--muted);
    font-size: 11.5px;
  }
  code {
    background: var(--code);
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: 1px 5px;
    font: 11.5px ui-monospace, Menlo, Consolas, monospace;
  }
</style>
</head>
<body>
<form class="card" id="form">
  <div class="brand">ONI3 <span>WEB</span></div>
  <div class="lock">&#128274;</div>
  <h1>需要访问令牌</h1>
  <p>此 ONI3 Web 实例已启用 Token 认证。</p>
  <label for="token">访问令牌</label>
  <input id="token" type="password" autocomplete="current-password" spellcheck="false" autofocus>
  <button id="submit" type="submit">进入</button>
  <div class="error" id="error"></div>
  <div class="hint">
    令牌来自 <code>oni3 web --token</code> 或环境变量
    <code>ONI3_WEB_TOKEN</code>。
  </div>
</form>
<script>
"use strict";
const form = document.getElementById("form");
const input = document.getElementById("token");
const button = document.getElementById("submit");
const errorEl = document.getElementById("error");

form.addEventListener("submit", async (event) => {
  event.preventDefault();
  const token = input.value.trim();
  if (!token) {
    errorEl.textContent = "请输入令牌";
    return;
  }
  button.disabled = true;
  errorEl.textContent = "";
  try {
    const res = await fetch("/api/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ token }),
    });
    if (res.status === 204) {
      window.location.replace("/");
      return;
    }
    let message = "令牌无效";
    try { message = (await res.json()).error || message; } catch (_) {}
    errorEl.textContent = message;
    input.select();
  } catch (err) {
    errorEl.textContent = "无法连接服务器：" + (err.message || err);
  } finally {
    button.disabled = false;
  }
});
</script>
</body>
</html>
